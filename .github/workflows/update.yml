name: Update Swift Package

on:
  workflow_call:
    inputs:
      url:
        required: false
        type: string
        default: "https://d14jk8f50gmy3e.cloudfront.net/iOS_APS_SDK/APS_iOS_SDK-{version}.zip"
        description: APS SDK bundle URL; {version} is replaced with the version input
      version:
        required: true
        type: string
        description: New version; cannot be lower than the previous version
      disable_mirror:
        required: false
        type: boolean
        default: false
        description: If true, the upstream URL is used directly instead of mirroring DTBiOSSDK to a GitHub release
  workflow_dispatch:
    inputs:
      url:
        required: false
        type: string
        default: "https://d14jk8f50gmy3e.cloudfront.net/iOS_APS_SDK/APS_iOS_SDK-{version}.zip"
        description: APS SDK bundle URL; {version} is replaced with the version input
      version:
        required: true
        type: string
        description: New version; cannot be lower than the previous version
      disable_mirror:
        required: false
        type: boolean
        default: false
        description: If true, the upstream URL is used directly instead of mirroring DTBiOSSDK to a GitHub release

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve source URL
        id: source
        run: |
          APS_URL="${{ inputs.url }}"
          APS_URL="${APS_URL//\{version\}/${{ inputs.version }}}"
          echo "url=$APS_URL" >> $GITHUB_OUTPUT

      - name: Download and repackage DTBiOSSDK from APS bundle
        id: binary_aps
        if: ${{ !inputs.disable_mirror }}
        run: |
          curl --fail -L "${{ steps.source.outputs.url }}" -o APS_iOS_SDK.zip

          unzip -q APS_iOS_SDK.zip -d APS_iOS_SDK

          XCFW=$(find APS_iOS_SDK -name "DTBiOSSDK.xcframework" -maxdepth 5 | head -1)
          if [ -z "$XCFW" ]; then
            echo "ERROR: DTBiOSSDK.xcframework not found in APS bundle"
            exit 1
          fi

          (cd "$(dirname "$XCFW")" && zip -qr "${GITHUB_WORKSPACE}/DTBiOSSDK.xcframework.zip" "DTBiOSSDK.xcframework")
          mv DTBiOSSDK.xcframework.zip DTBiOSSDK.zip

          CHECKSUM=$(swift package compute-checksum DTBiOSSDK.zip)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: Download updated binary and compute checksum
        id: binary_standard
        if: ${{ inputs.disable_mirror }}
        run: |
          curl --fail "${{ steps.source.outputs.url }}" > framework.zip
          echo checksum=`swift package compute-checksum framework.zip` >> $GITHUB_OUTPUT

      - name: Resolve final checksum and url
        id: binary
        run: |
          if [[ "${{ inputs.disable_mirror }}" != "true" ]]; then
            echo "checksum=${{ steps.binary_aps.outputs.checksum }}" >> $GITHUB_OUTPUT
            echo "url=https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/DTBiOSSDK.zip" >> $GITHUB_OUTPUT
          else
            echo "checksum=${{ steps.binary_standard.outputs.checksum }}" >> $GITHUB_OUTPUT
            echo "url=${{ steps.source.outputs.url }}" >> $GITHUB_OUTPUT
          fi

      - name: Update Package
        run: |
          TMP_FILE=$(mktemp)
          sed -E \
            "/^[[:space:]]*\\.binaryTarget\\(/,/^[[:space:]]*[)]+/ {
              /[[:space:]]*url:[[:space:]]*\"([^\"]+)\"/ {
                s|^([[:space:]]*url:[[:space:]]*)\"[^\"]+\"|\\1\"${{ steps.binary.outputs.url }}\"|
              }
              /[[:space:]]*checksum:[[:space:]]*\"([^\"]+)\"/ {
                s|^([[:space:]]*checksum:[[:space:]]*)\"[^\"]+\"|\\1\"${{ steps.binary.outputs.checksum }}\"|
              }
            }" Package.swift > "$TMP_FILE"
          mv "$TMP_FILE" Package.swift

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "Updated to version ${{ inputs.version }}"

      - name: Validate Package
        run: |
          if [[ "${{ inputs.disable_mirror }}" != "true" ]]; then
            unzip -q DTBiOSSDK.zip

            # Swap to local path target
            TMP=$(mktemp)
            sed -E \
              "/^[[:space:]]*\.binaryTarget\(/,/^[[:space:]]*\)/ {
                /url:/ d
                /checksum:/ d
                s|(name:[[:space:]]*\"DTBiOSSDK\")|\1,\n            path: \"DTBiOSSDK.xcframework\"|
              }" Package.swift > "$TMP"
            mv "$TMP" Package.swift
          fi

          swift package reset
          swift package resolve
          RESULT=$?

          git checkout -f
          exit $RESULT

      - name: Push Changes
        run: git push

      - name: Create Release
        if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create ${{ inputs.version }}
          --repo ${{ github.repository }}
          -t ${{ inputs.version }}
          --fail-on-no-commits
          ${{ !inputs.disable_mirror && 'DTBiOSSDK.zip' || '' }}